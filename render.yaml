services:
  - type: web
    name: atlas-ai
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install .

    startCommand: alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEYS
        sync: false

      - key: TWELVE_DATA_API_KEY
        sync: false

databases:
  - name: atlas-db
    plan: free
    region: singapore