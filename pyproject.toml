[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai"
version = "0.1.0"
description = "Atlas AI — Modular AI assistant communication & persistence slice"
authors = [{ name = "Atlas AI Team" }]
requires-python = ">=3.11"
dependencies = [
"fastapi>=0.100.0",
"uvicorn>=0.22.0",
"sqlalchemy[asyncio]>=2.0.0",
"asyncpg>=0.28.0",
"alembic>=1.11.0",
"pydantic>=2.0.0",
"pydantic-settings>=2.0.0",
"python-dotenv>=1.0.0",
"python-telegram-bot>=20.0",
"httpx>=0.24.0",
"ftfy>=6.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]
